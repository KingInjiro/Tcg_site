ServerName localhost
<VirtualHost *:${TCG_HTTP_PORT}>
    DocumentRoot "${TCG_PUBLIC_ROOT}"
</VirtualHost>
<VirtualHost *:${TCG_HTTPS_PORT}>
    DocumentRoot "${TCG_PUBLIC_ROOT}"
    SSLEngine on
    SSLCertificateFile "${TCG_TLS_CERT}"
    SSLCertificateKeyFile "${TCG_TLS_KEY}"
</VirtualHost>
<Directory "${TCG_PUBLIC_ROOT}">
    php_admin_value open_basedir "${TCG_OPEN_BASEDIR}"
    Require all granted
    Options -Indexes -FollowSymLinks -MultiViews
    AllowOverride None
    DirectoryIndex index.html
</Directory>
# Deliberately no rewrite and no .htaccess dependency.
