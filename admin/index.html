<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ Панель - Управление контентом</title>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
    <style>
      #error-log { color: red; font-family: monospace; padding: 20px; white-space: pre-wrap; }
    </style>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML += '<div id="error-log">CMS Error: ' + message + '\n' + (error ? error.stack : '') + '</div>';
      };
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <!-- Decap CMS will render here -->
  </body>
</html>
