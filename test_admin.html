<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Content Manager</title>
  




<style>
  /* Safe font increase */
  body, p, td, span, div, a, font, li {
    font-size: 16px;
    line-height: 1.5;
  }
  font[size="1"] { font-size: 14px; }
  font[size="2"] { font-size: 16px; }
  font[size="3"] { font-size: 18px; }
  
  .left-nav-icon {
    width: 165px !important; /* increased from 132px */
    height: auto !important;
    margin-bottom: 5px;
  }
  .top-nav-icon {
    width: 100px !important; /* slightly increased from 90 */
    height: auto !important;
  }
  
  /* Ad containers */
  .ad-left, .ad-right {
    position: fixed;
    top: 150px;
    width: 160px;
    height: 600px;
    background-color: transparent;
    border: 1px dashed #ccc;
    text-align: center;
    padding: 10px;
    color: #666;
    font-size: 12px;
    z-index: 100;
  }
  .ad-left { left: 5px; }
  .ad-right { right: 5px; }
  @media (max-width: 1300px) {
    .ad-left, .ad-right { display: none !important; }
  }
</style>

</head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'test/test',
            branch: 'main'
          }
        }
      });
    </script>
  
<div class="ad-left">Место для рекламы (Л)</div>
<div class="ad-right">Место для рекламы (П)</div>

</body>
</html>
