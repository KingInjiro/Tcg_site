name: PHP administration
on:
  push:
    branches: ['feature/autonomous-php-admin']
  pull_request:
    paths: ['php/**', 'scripts/prepare-php.js', 'tests/php/**', '.github/workflows/php-admin.yml']
permissions:
  contents: read
concurrency:
  group: php-admin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, gd, zip
          coverage: none
      - run: npm ci --ignore-scripts
      - name: PHP syntax
        run: find php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Real PHP API over verified TLS
        run: node --test tests/php/*.test.cjs
  old-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.4', '8.0', '8.1']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Diagnostic and unsupported API entry remain parseable
        run: |
          php -l php/public/admin/diagnostic.php
          php -l php/public/admin/api.php
          php php/public/admin/diagnostic.php > /tmp/tcg-diagnostic.json
          php -r '$d=json_decode(file_get_contents("/tmp/tcg-diagnostic.json"),true); if (!$d || $d["supported"] !== false) exit(1);'
          php php/public/admin/api.php > /tmp/tcg-unsupported.json
          php -r '$d=json_decode(file_get_contents("/tmp/tcg-unsupported.json"),true); if (!$d || !isset($d["error"])) exit(1);'
