name: Site checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 56373e97ce218fbd390219e299538b70f95fb26c
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Check dependencies
        run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run test:html
      - run: npm run test:content
      - run: npm run test:calculators
      - run: npm run test:browser
      - run: npm run test:functionality
      - run: npm run test:functionality
        env:
          TCG_TEST_BROWSER: firefox
      - run: npm run test:functionality
        env:
          TCG_TEST_BROWSER: webkit
      - run: npm run test:accessibility
      - run: npm run test:preservation
        env:
          TCG_BASELINE_DIR: baseline
